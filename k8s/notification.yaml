apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  ports:
    - port: 4004
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: lasindu123/notification-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          env:
            - name: PORT
              value: "4004"
            # FIX: MONGODB_URL was missing — defaulted to localhost:27017 (broken in K8s)
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: mongodb-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: rabbitmq-url
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 20
            periodSeconds: 20