apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  ports:
    - port: 4004
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: lasindu123/notification-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          env:
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672
