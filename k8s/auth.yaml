apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
    - port: 4001
  selector:
    app: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: lasindu123/auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: database-url
            # FIX: JWT_SECRET was missing — was falling back to hardcoded default
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: jwt-secret
          # FIX: readiness/liveness probes were missing — service got traffic before ready
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 20