apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: lasindu123/gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000

          env:
            - name: PORT
              value: "4000"

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:4001"

            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:4002"

            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:4003"
