apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  ports:
    - port: 4002
  selector:
    app: booking-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: lasindu123/booking-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: database-url
            # FIX: JWT_SECRET was missing — tokens validated with wrong secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: jwt-secret
            # FIX: was "amqp://rabbitmq:5672" — correct full AMQP URI below
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: rabbitmq-url
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 20
            periodSeconds: 20