  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    env_file:
      - ./services/auth-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4001:4001"

  booking-service:
    build: ./services/booking-service
    env_file:
      - ./services/booking-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4002:4002"

  payment-service:
    build: ./services/payment-service
    env_file:
      - ./services/payment-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      booking-service:
        condition: service_started
    ports:
      - "4003:4003"

  notification-service:
    build: ./services/notification-service
    env_file:
      - ./services/notification-service/.env.example
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "4004:4004"

  gateway:
    build: ./gateway
    env_file:
      - ./gateway/.env.example
    depends_on:
      - auth-service
      - booking-service
      - payment-service
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - gateway
    ports:
      - "3001:3000"

