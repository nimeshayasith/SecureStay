apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.paymentService.replicas }}
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.paymentService.image }}:{{ .Values.paymentService.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.paymentService.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: jwt-secret
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: rabbitmq-url
            - name: BOOKING_SERVICE_INTERNAL_URL
              value: "http://booking-service:{{ .Values.bookingService.port }}"
            - name: PORT
              value: "{{ .Values.paymentService.port }}"
            - name: NODE_ENV
              value: "production"
          resources:
            {{- toYaml .Values.paymentService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.paymentService.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.paymentService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
