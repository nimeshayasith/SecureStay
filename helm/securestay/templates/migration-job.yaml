{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: securestay-db-migrate
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Running schema migration..."
              psql "$DATABASE_URL" -c "
                CREATE TABLE IF NOT EXISTS users (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  email VARCHAR(255) UNIQUE NOT NULL,
                  full_name VARCHAR(255),
                  password_hash VARCHAR(255) NOT NULL,
                  role VARCHAR(50) NOT NULL DEFAULT 'customer',
                  created_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  updated_at TIMESTAMP NOT NULL DEFAULT NOW()
                );
                CREATE TABLE IF NOT EXISTS hotels (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  name VARCHAR(255) NOT NULL,
                  city VARCHAR(255),
                  location VARCHAR(255),
                  address TEXT,
                  description TEXT,
                  created_at TIMESTAMP NOT NULL DEFAULT NOW()
                );
                CREATE TABLE IF NOT EXISTS rooms (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  hotel_id UUID NOT NULL REFERENCES hotels(id) ON DELETE CASCADE,
                  room_number VARCHAR(50),
                  room_type VARCHAR(100) NOT NULL,
                  price_per_night NUMERIC(10,2) NOT NULL,
                  capacity INTEGER NOT NULL DEFAULT 2,
                  is_available BOOLEAN NOT NULL DEFAULT TRUE,
                  is_active BOOLEAN NOT NULL DEFAULT TRUE,
                  created_at TIMESTAMP NOT NULL DEFAULT NOW()
                );
                CREATE TABLE IF NOT EXISTS bookings (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  user_id UUID NOT NULL REFERENCES users(id),
                  room_id UUID NOT NULL REFERENCES rooms(id),
                  check_in_date DATE NOT NULL,
                  check_out_date DATE NOT NULL,
                  total_amount NUMERIC(10,2) NOT NULL DEFAULT 0,
                  guest_count INTEGER NOT NULL DEFAULT 1,
                  status VARCHAR(50) NOT NULL DEFAULT 'PENDING',
                  created_at TIMESTAMP NOT NULL DEFAULT NOW(),
                  updated_at TIMESTAMP NOT NULL DEFAULT NOW()
                );
                CREATE TABLE IF NOT EXISTS payments (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  booking_id UUID NOT NULL REFERENCES bookings(id),
                  amount NUMERIC(10,2) NOT NULL,
                  currency VARCHAR(10) NOT NULL DEFAULT 'USD',
                  payment_method VARCHAR(50),
                  transaction_reference VARCHAR(255),
                  status VARCHAR(50) NOT NULL DEFAULT 'PENDING',
                  masked_card_number VARCHAR(20),
                  processed_at TIMESTAMP,
                  created_at TIMESTAMP NOT NULL DEFAULT NOW()
                );
                CREATE TABLE IF NOT EXISTS notification_logs (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  routing_key VARCHAR(255) NOT NULL,
                  event_type VARCHAR(100) NOT NULL,
                  payload JSONB NOT NULL,
                  status VARCHAR(50) NOT NULL DEFAULT 'delivered',
                  received_at TIMESTAMP NOT NULL DEFAULT NOW()
                );
                CREATE INDEX IF NOT EXISTS idx_notification_received_at
                  ON notification_logs (received_at DESC);
                CREATE INDEX IF NOT EXISTS idx_notification_event_type
                  ON notification_logs (event_type);
                INSERT INTO hotels (id, name, city, location, description) VALUES
                  ('11111111-1111-1111-1111-111111111111','Grand Colombo Hotel','Colombo','Colombo, Sri Lanka','Luxury hotel in Colombo'),
                  ('22222222-2222-2222-2222-222222222222','Kandy Hills Resort','Kandy','Kandy, Sri Lanka','Mountain resort near Temple of the Tooth')
                ON CONFLICT DO NOTHING;
                INSERT INTO rooms (hotel_id, room_number, room_type, price_per_night, capacity) VALUES
                  ('11111111-1111-1111-1111-111111111111','101','Deluxe Single',85.00,1),
                  ('11111111-1111-1111-1111-111111111111','102','Deluxe Double',120.00,2),
                  ('11111111-1111-1111-1111-111111111111','201','Suite',200.00,4),
                  ('22222222-2222-2222-2222-222222222222','101','Standard Single',60.00,1),
                  ('22222222-2222-2222-2222-222222222222','102','Standard Double',90.00,2)
                ON CONFLICT DO NOTHING;
              "
              echo "Migration complete."
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: securestay-secrets
                  key: database-url
{{- end }}
