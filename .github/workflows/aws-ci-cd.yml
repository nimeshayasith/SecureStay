name: SecureStay AWS CI/CD Pipeline

on:
  push:
    branches:
      - main 
      - dayani  # change if you deploy from another branch

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: securestay
  IMAGE_TAG: latest

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker images
      - name: Build Docker images
        run: |
          docker build -t $ECR_REPOSITORY-auth ./services/auth-service
          docker build -t $ECR_REPOSITORY-booking ./services/booking-service
          docker build -t $ECR_REPOSITORY-payment ./services/payment-service
          docker build -t $ECR_REPOSITORY-gateway ./services/gateway
          docker build -t $ECR_REPOSITORY-notification ./services/notification-service

      # 5. Tag images for ECR
      - name: Tag images
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker tag $ECR_REPOSITORY-auth:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-auth:latest
          docker tag $ECR_REPOSITORY-booking:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-booking:latest
          docker tag $ECR_REPOSITORY-payment:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-payment:latest
          docker tag $ECR_REPOSITORY-gateway:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-gateway:latest
          docker tag $ECR_REPOSITORY-notification:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-notification:latest

      # 6. Push images to ECR
      - name: Push images
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-auth:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-booking:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-payment:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-gateway:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY-notification:latest

  deploy-to-ec2:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/securestay

            echo "Pulling latest images..."
            docker compose -f docker-compose.yml -f docker-compose.aws.yml pull

            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d